# ==========================================================================
# 微调配方 v4 —— 冻结编码器 + 冻结终止头(frontier_pred), 只训化学头
#
# 依据(同规模同种子 A/B 实测, 靶点 A2A, 60 样本/束宽 50/40 步/种子 2024):
#   官方基线                        : 完成 63 | QED 中位 0.7445 | SA 3.8332 | 骨架 45 | 穿模 0.00%
#   v3a(冻结编码器 + lr1e-4)        : 完成 23 | QED 中位 0.6823 | SA 2.7165 | 骨架 17 | 穿模 0.00%
#   v3b(全网络 + lr2e-5)           : 完成  7 | QED 中位 0.6735 | SA 5.4552 | 骨架  7 | 穿模 0.00%
#
# 决定性证据: 两次的采样日志都是 "[Pool] Queue 50 | Finished N | Failed 0"
#   -> 分子不是重建失败(不是化学无效), 而是**永不终止生长**, 一直占着队列到步数用尽。
#   终止判据由 frontier_pred(self.frontier_pred, 见 src/models/maskfill.py::sample_focal)
#   给出, 而它正落在"只训头部"被更新的范围内。
#
# 本配置: 把 encoder 与 frontier_pred 一并冻结 —— 特征与"何时停"都保持预训练解,
#   只让元素/键/位置头适配 GPCR 口袋。这样 v3a 已经拿到的收益(穿模 0%、SA 2.72、
#   接触距离 2.35 A 贴近实验参考)应当保留, 而产量不应再腰斩。
#
# 其余同 v3(实验坐标数据 / grad_accum 8 / best.pt + 早停 / 训练前验收门)。
# ==========================================================================

model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt

  # --- 修复点 2: 有效 batch = batch_size x grad_accum = 8 ---
  batch_size: 1
  grad_accum: 8
  num_workers: 0
  pin_memory: false

  # --- 修复点 5: 给足迭代空间 ---
  max_iters: 6000
  val_freq: 200

  # --- 修复点 3: 按验证损失存 best.pt + 早停 ---
  early_stop_patience: 6        # 6 x val_freq(200) = 1200 步未改善即停
  early_stop_min_iters: 1200    # 至少训到首个可能的谷底附近再允许早停

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  # --- 修复点 4: 冻结编码器, 只训头部, 用更大学习率 ---
  freeze_encoder: true
  freeze_patterns: [frontier_pred]
  optimizer:
    type: adam
    lr: 5.e-5
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 3                 # 3 x val_freq(200) = 600 步未改善则降 lr
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      # 关键: 必须 >= 1。旧值 0 会让配体以 9.09% 概率被全部掩码,
      # context 为空 -> loss_frontier = BCE(空,空) = NaN
      min_num_unmasked: 1
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

# --- 修复点 1: 实验坐标重建的数据集(无穿模) ---
dataset:
  name: pl
  path: ./data/gpcr_ft_v3
  split: ./data/gpcr_ft_v3/split_by_name.pt
