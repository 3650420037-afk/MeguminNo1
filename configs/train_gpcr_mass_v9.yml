# ==========================================================================
# 微调配方 v9 —— 用**全量 ChEMBL 活性分子对接**建成的高密度数据集训练
#
# 为什么做这一步
# --------------
# 已实测的决定性因素是「**每口袋样本密度**」，不是总数据量：
#   - data/gpcr_ft_v3  : 262 对 / **262 个口袋 = 1.0 对/口袋** -> 停止策略不可学,
#                        采样日志 Failed=0、分子永不终止(完成数 63 -> 23/7);
#   - data/gpcr_dock_v1: 307 对 / **4 个口袋 = 40-127 对/口袋** -> 产率恢复(61/64)。
# 本配方用的 data/gpcr_mass_v1 把两件事同时推高：口袋数仍是 4 个(我们的靶点),
# 但每口袋样本数由 40-127 提升到**千级** —— 由 src/scripts/mass_dock_actives.py
# 把 4 个靶点的**全量** ChEMBL 活性分子(17,177 个, 过滤后约 15,000)对接进实验口袋得到。
#
# 起点与架构
# ----------
# init_checkpoint = models/7-eonmol_ft_gpcr_v3.pt(当前的交付/默认权重 = v8 的 iter 800)。
# 架构与 v3 完全相同(解冻 encoder + 分层 LR + frontier 256/64/2), 因此**不需要**
# init_strict=false —— 形状完全匹配, 走严格的 load_state_dict。这比从官方权重
# 重新扩容要干净: 不引入任何随机初始化的模块。
#
# 训练预算(必须重算, 不能照搬 —— 这是本配方最容易出错的地方)
# ----------------------------------------------------------
# v6/v8 的 6000 步是在 307 个样本上跑的, 相当于 ~19.5 个 epoch;
# 若照搬到 ~15,000 个样本上, 6000 步只有 **0.4 个 epoch**。故:
#   max_iters 12000 (≈0.8 epoch) + val_freq 500 + 早停 patience 6(=3000 步)
#   + early_stop_min_iters 2000(至少训到这里再允许早停)
# 并按**生成指标**而非验证损失选点(本项目已多次证明验证损失不能预测生成质量)。
#
# 判据(全部在出货目标 diversity_w=0.5 下、同种子成对、双种子)
# ---------------------------------------------------------
#   硬性: 完成数 >= 基线-5; QED 中位 >= 基线-0.05; SA 中位 <= 基线+0.3; 骨架 >= 基线*0.8
#   首要轴(结合强度): Vina 中位不得比基线差超过 0.20(噪声底实测约 0.14)
# 用 src/scripts/ab_docking_compare.py 做对接级判定。
# ==========================================================================

model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3
  # 与 v3 完全一致(故可直接严格加载 v3 权重, 无随机初始化模块)
  frontier:
    hidden_sca: 256
    hidden_vec: 64
    layers: 2

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/7-eonmol_ft_gpcr_v3.pt
  # 架构与 v3 相同 -> 形状全匹配 -> 保持严格加载(无需 init_strict: false)

  batch_size: 1
  grad_accum: 8                 # 有效 batch = 8
  num_workers: 0
  pin_memory: false

  # --- 针对 ~15,000 样本重算的预算(见文件头说明) ---
  max_iters: 12000
  val_freq: 500
  early_stop_patience: 6        # 6 x 500 = 3000 步未改善即停
  early_stop_min_iters: 2000

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  freeze_encoder: false
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
    param_groups:
      - {pattern: frontier_pred, lr: 5.e-4}
      - {pattern: encoder,       lr: 1.e-5}

  scheduler:
    type: plateau
    factor: 0.6
    patience: 3
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      min_num_unmasked: 1      # 必须 >=1, 否则全掩码 -> context 为空 -> NaN
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

dataset:
  name: pl
  path: ./data/gpcr_mass_v1
  split: ./data/gpcr_mass_v1/split_by_name.pt
