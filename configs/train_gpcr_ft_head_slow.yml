# ==========================================================================
# 微调配方 v3b —— 在 v3 基础上把头部学习率由 1e-4 降到 2e-5
#
# 依据(A/B 实测, 靶点 A2A, 60 样本/束宽 50/40 步/种子 2024):
#   v3 (lr=1e-4): 完成 23 | QED 中位 0.682 | SA 中位 2.72 | 穿模率 0.0% | 最近距离中位 2.35 A
#   官方基线    : 完成 63 | QED 中位 0.744 | SA 中位 3.83 | 穿模率 0.0% | 最近距离中位 3.22 A
#
#   -> 数据修复本身是成功的: 穿模率 5.97%(旧微调) -> 0%, SA 从 3.83 改善到 2.72,
#      配体-口袋接触距离 2.35 A 贴近实验参考 2.5-3.3 A。
#   -> 但产量腰斩(63 -> 23): "分子是否终止生长"由 focal 头决定, 而它正是只训头部时
#      被大幅更新的部分。lr=1e-4 把它推离了预训练解。故降到 2e-5。
#
# 其余改动同 train_gpcr_ft_head.yml(实验坐标数据 / grad_accum / best.pt + 早停)。
# ==========================================================================

model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt

  # --- 修复点 2: 有效 batch = batch_size x grad_accum = 8 ---
  batch_size: 1
  grad_accum: 8
  num_workers: 0
  pin_memory: false

  # --- 修复点 5: 给足迭代空间 ---
  max_iters: 6000
  val_freq: 200

  # --- 修复点 3: 按验证损失存 best.pt + 早停 ---
  early_stop_patience: 6        # 6 x val_freq(200) = 1200 步未改善即停
  early_stop_min_iters: 1200    # 至少训到首个可能的谷底附近再允许早停

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  # --- 修复点 4: 冻结编码器, 只训头部, 用更大学习率 ---
  freeze_encoder: true
  optimizer:
    type: adam
    lr: 2.e-5
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 3                 # 3 x val_freq(200) = 600 步未改善则降 lr
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      # 关键: 必须 >= 1。旧值 0 会让配体以 9.09% 概率被全部掩码,
      # context 为空 -> loss_frontier = BCE(空,空) = NaN
      min_num_unmasked: 1
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

# --- 修复点 1: 实验坐标重建的数据集(无穿模) ---
dataset:
  name: pl
  path: ./data/gpcr_ft_v3
  split: ./data/gpcr_ft_v3/split_by_name.pt
