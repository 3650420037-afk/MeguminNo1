model:
    checkpoint: ./ckpt/pretrained_Pocket2Mol.pt

sample:
  seed: 2024
  num_samples: 50
  beam_size: 100
  max_steps: 50
  threshold:
    focal_threshold: 0.5
    pos_threshold: 0.25
    element_threshold: 0.3
    hasatom_threshold: 0.6
    bond_threshold: 0.4
  guided:
    enabled: true
    qed_w: 1.0
    sa_w: 1.0
    lam: 3
