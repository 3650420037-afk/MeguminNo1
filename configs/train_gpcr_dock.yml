# ==========================================================================
# 微调配方 v6 —— 方案 A: 对接构建的"高密度 + 物理可行位姿"数据集
#
# 依据: 前 5 组配方全部 NOT_PROMOTED, 根因收敛为「每口袋约 1 个训练样本」导致
#       生长/终止回路被破坏(采样日志 Failed=0, 分子永不终止)。
#       对照: 旧数据位姿坏(31.5% 粗穿模)但"4 个口袋 x ~96 样本", 产量反而保住(67)。
#       => 每口袋密度比总量更重要。
#
# 数据(data/gpcr_dock_v1, 由 src/scripts/build_docked_dataset.py 构建):
#   用 AutoDock Vina 把各靶点的 ChEMBL 活性集对接进**实验口袋**, 一次性拿到两者:
#     每口袋样本     : A2A 127 / B2AR 72 / D3 68 / 5HT2B 40 (旧数据 1.04/口袋)
#     位姿物理可行   : 最近重原子距离 中位 2.742 A, 最小 1.653 A (判据 >= 1.5) -> 零穿模
#   治理同 build_gpcr_v3(元素词表 C/N/O/F/P/S/Cl、类药性、MW[250,600]、QED>=0.30、
#   环数>=2), 划分按靶点分层随机(seed=2021, val 15%)。
#
# 训练配方与 v3a 一致(便于对比): 冻结编码器 + lr 1e-4 + grad_accum 8 + best.pt + 早停。
# ==========================================================================

model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt

  # --- 修复点 2: 有效 batch = batch_size x grad_accum = 8 ---
  batch_size: 1
  grad_accum: 8
  num_workers: 0
  pin_memory: false

  # --- 修复点 5: 给足迭代空间 ---
  max_iters: 6000
  val_freq: 200

  # --- 修复点 3: 按验证损失存 best.pt + 早停 ---
  early_stop_patience: 6        # 6 x val_freq(200) = 1200 步未改善即停
  early_stop_min_iters: 1200    # 至少训到首个可能的谷底附近再允许早停

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  # --- 修复点 4: 冻结编码器, 只训头部, 用更大学习率 ---
  freeze_encoder: true
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 3                 # 3 x val_freq(200) = 600 步未改善则降 lr
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      # 关键: 必须 >= 1。旧值 0 会让配体以 9.09% 概率被全部掩码,
      # context 为空 -> loss_frontier = BCE(空,空) = NaN
      min_num_unmasked: 1
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

# --- 修复点 1: 实验坐标重建的数据集(无穿模) ---
dataset:
  name: pl
  path: ./data/gpcr_dock_v1
  split: ./data/gpcr_dock_v1/split_by_name.pt
