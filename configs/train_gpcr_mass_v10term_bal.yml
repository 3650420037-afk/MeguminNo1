# v10-term-bal = v10 配方 + **训练侧终止修复·逐样本平衡档**（M8 处方②升级档），2026-09-29 19:20
# ---------------------------------------------------------------------------
# 与 v10 的差别（仅这两处，其余完全一致：官方起点 + gpcr_mass_v1 四口袋 + 同超参/种子）：
#   ① **密集存点**：val_freq 500 -> **250**（配合"按多种子尺寸稳定性选点"的处方①，
#      因为 §5.33 实测凹坑寿命 ≲500–1000 步，500 步栅格会整点落在坑里）；
#      同时 early_stop_patience 6 -> **12**，保持"连续 3000 步无改善才停"的语义不变。
#   ② **frontier 逐样本类别平衡** `frontier_balance: true`（取代 v10term 的常数 2.0）：
#      实测（src/scripts/measure_frontier_balance.py，600 样本）正类**微平均仅 20.6%**，
#      且**逐样本极不均匀**（p10 0.061 / p50 0.265 / p90 1.000）→ 全局常数无法同时适配
#      "上下文只剩两个原子(几乎全正)"与"上下文很大(几乎全负)"两类样本，是终止校准漂移的
#      可疑机制。本档按 batch 内 n_neg/n_pos 逐样本平衡并 clip 到 [1,10]（默认 False=逐位一致）。
#   ③ 其余与 v10term 相同（250 步密集存点、patience 12、官方起点、gpcr_mass_v1 四口袋）。
# 数据说明：**仍用 4 口袋的 gpcr_mass_v1**，不用 11 口袋——因为 v11（预算不足）与 v11b（预算修正后）
#   都已实测失败（§5.31/§5.34），扩口袋不是杠杆；本次单变量只查"终止监督"。
model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3
  # 与 v3 完全一致(故可直接严格加载 v3 权重, 无随机初始化模块)
  # M8 处方②升级档：逐样本类别平衡（覆盖下面的常数权重）；
  # 关掉即回到 frontier_pos_weight 的常数档，删掉这两个键即回到官方行为。
  frontier_balance: true
  frontier_balance_clip: [1.0, 10.0]
  frontier_pos_weight: 2.0   # 仅在 frontier_balance=false 时生效（保留以便对照/回退）
  frontier:
    hidden_sca: 128
    hidden_vec: 32
    layers: 1

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt
  # 架构与 v3 相同 -> 形状全匹配 -> 保持严格加载(无需 init_strict: false)

  batch_size: 1
  grad_accum: 8                 # 有效 batch = 8
  num_workers: 0
  pin_memory: false

  # --- 针对 ~15,000 样本重算的预算(见文件头说明) ---
  max_iters: 12000
  val_freq: 250
  early_stop_patience: 12        # **12 x 250 = 3000 步**未改善即停（与 v10 的 6x500 等价）
  early_stop_min_iters: 2000

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  freeze_encoder: false
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
    param_groups:
      - {pattern: frontier_pred, lr: 5.e-4}
      - {pattern: encoder,       lr: 1.e-5}

  scheduler:
    type: plateau
    factor: 0.6
    patience: 3
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      min_num_unmasked: 1      # 必须 >=1, 否则全掩码 -> context 为空 -> NaN
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

dataset:
  name: pl
  path: ./data/gpcr_mass_v1
  split: ./data/gpcr_mass_v1/split_by_name.pt
