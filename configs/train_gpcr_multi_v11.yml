# v11 = v10 配方（官方预训练起点 + 高密度对接数据）换到【多口袋数据集】
# ---------------------------------------------------------------------------
# 与 v10 的**唯一差别**：数据集从 4 口袋的 gpcr_mass_v1(12,244 对) 换成
# gpcr_multi_v1 = 4 老口袋 + 7 个新人源 Class A 口袋（D2/5HT1A/5HT2A/M1/H1/OPRM1/OPRK1），
# 数据、配方、分层 LR、早停、种子全部保持与 v10 一致 —— 构成"口袋数"的单变量对照。
#
# 目的（用户路线①后半）：验证"按受体分组扩到数十个口袋"能否改善**未见受体**上的泛化，
# 并尝试补上 v10 唯一明显落后的 D3（其落后已被诊断为"口袋条件性终止"）。
model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3
  # 与 v3 完全一致(故可直接严格加载 v3 权重, 无随机初始化模块)
  frontier:
    hidden_sca: 128
    hidden_vec: 32
    layers: 1

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt
  # 架构与 v3 相同 -> 形状全匹配 -> 保持严格加载(无需 init_strict: false)

  batch_size: 1
  grad_accum: 8                 # 有效 batch = 8
  num_workers: 0
  pin_memory: false

  # --- 针对 ~15,000 样本重算的预算(见文件头说明) ---
  max_iters: 12000
  val_freq: 500
  early_stop_patience: 6        # 6 x 500 = 3000 步未改善即停
  early_stop_min_iters: 2000

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  freeze_encoder: false
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
    param_groups:
      - {pattern: frontier_pred, lr: 5.e-4}
      - {pattern: encoder,       lr: 1.e-5}

  scheduler:
    type: plateau
    factor: 0.6
    patience: 3
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      min_num_unmasked: 1      # 必须 >=1, 否则全掩码 -> context 为空 -> NaN
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

dataset:
  name: pl
  path: ./data/gpcr_multi_v1
  split: ./data/gpcr_multi_v1/split_by_name.pt
