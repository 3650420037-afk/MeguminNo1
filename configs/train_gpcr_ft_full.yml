# ==========================================================================
# 微调配方 v3c —— 全网络微调 + lr 2e-5 + 新修复数据(隔离变量实验)
#
# 已观测到的两次结果(靶点 A2A, 60 样本/束宽 50/40 步/种子 2024):
#   官方基线                      : 完成 63 | QED 中位 0.744 | SA 中位 3.83 | 穿模率 0.0%
#   旧配方(全网络, lr 2e-5, 旧数据): 完成 67 | QED 中位 0.668 | SA 中位 3.43 | 穿模率 5.97%
#   新配方(冻结, lr 1e-4, 新数据)  : 完成 23 | QED 中位 0.682 | SA 中位 2.72 | 穿模率 0.0%
#
# 旧配方保住了产量(67 vs 63)但穿模 5.97%(数据坏); 新配方修好了穿模但产量腰斩
# (lr 1e-4 过大 / 冻结编码器使头部独自承担分布漂移)。
# 本配置换回"全网络 + lr 2e-5", 只把数据换成修复版, 以隔离出数据的作用。
#
# 相对旧配方的唯一额外改动: grad_accum=8 (旧配方 batch=1, 实测梯度噪声标准差 > 均值)。
# ==========================================================================

model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3

train:
  seed: 2022
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt

  # --- 修复点 2: 有效 batch = batch_size x grad_accum = 8 ---
  batch_size: 1
  grad_accum: 8
  num_workers: 0
  pin_memory: false

  # --- 修复点 5: 给足迭代空间 ---
  max_iters: 6000
  val_freq: 200

  # --- 修复点 3: 按验证损失存 best.pt + 早停 ---
  early_stop_patience: 6        # 6 x val_freq(200) = 1200 步未改善即停
  early_stop_min_iters: 1200    # 至少训到首个可能的谷底附近再允许早停

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  # --- 修复点 4: 冻结编码器, 只训头部, 用更大学习率 ---
  freeze_encoder: false
  optimizer:
    type: adam
    lr: 2.e-5
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 3                 # 3 x val_freq(200) = 600 步未改善则降 lr
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      # 关键: 必须 >= 1。旧值 0 会让配体以 9.09% 概率被全部掩码,
      # context 为空 -> loss_frontier = BCE(空,空) = NaN
      min_num_unmasked: 1
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

# --- 修复点 1: 实验坐标重建的数据集(无穿模) ---
dataset:
  name: pl
  path: ./data/gpcr_ft_v3
  split: ./data/gpcr_ft_v3/split_by_name.pt
