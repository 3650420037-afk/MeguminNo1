# v10b = v10 的第二次独立训练（只换训练随机种子 2022 -> 2027）
# ---------------------------------------------------------------------------
# 目的：检验"换起点（官方权重）修复分子偏小"是配方效应还是单次运行的偶然。
# 若 v10b 也落在 MW≈400 / 重原子≈29（官方 381/28、数据先验 396/29），
# 则结论在训练运行之间也成立；否则要收窄。数据/配方/早停/分层 LR 与 v10 完全相同。
model:
  vn: vn
  hidden_channels: 256
  hidden_channels_vec: 64
  encoder:
    name: cftfm
    hidden_channels: 256
    hidden_channels_vec: 64
    edge_channels: 64
    key_channels: 128
    num_heads: 4
    num_interactions: 6
    cutoff: 10.0
    knn: 48
  field:
    name: classifier
    num_filters: 128
    num_filters_vec: 32
    edge_channels: 64
    num_heads: 4
    cutoff: 10.0
    knn: 32
  position:
    num_filters: 128
    n_component: 3
  # 与 v3 完全一致(故可直接严格加载 v3 权重, 无随机初始化模块)
  frontier:
    hidden_sca: 128
    hidden_vec: 32
    layers: 1

train:
  seed: 2027
  use_apex: false
  init_checkpoint: models/pretrained_Pocket2Mol.pt
  # 架构与 v3 相同 -> 形状全匹配 -> 保持严格加载(无需 init_strict: false)

  batch_size: 1
  grad_accum: 8                 # 有效 batch = 8
  num_workers: 0
  pin_memory: false

  # --- 针对 ~15,000 样本重算的预算(见文件头说明) ---
  max_iters: 12000
  val_freq: 500
  early_stop_patience: 6        # 6 x 500 = 3000 步未改善即停
  early_stop_min_iters: 2000

  pos_noise_std: 0.1
  max_grad_norm: 100.0

  freeze_encoder: false
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0
    beta1: 0.99
    beta2: 0.999
    param_groups:
      - {pattern: frontier_pred, lr: 5.e-4}
      - {pattern: encoder,       lr: 1.e-5}

  scheduler:
    type: plateau
    factor: 0.6
    patience: 3
    min_lr: 1.e-6

  transform:
    mask:
      type: mixed
      min_ratio: 0.0
      max_ratio: 1.1
      min_num_masked: 1
      min_num_unmasked: 1      # 必须 >=1, 否则全掩码 -> context 为空 -> NaN
      p_random: 0.15
      p_bfs: 0.6
      p_invbfs: 0.25
    contrastive:
      num_real: 20
      num_fake: 20
      pos_real_std: 0.05
      pos_fake_std: 2.0
    edgesampler:
      k: 8

dataset:
  name: pl
  path: ./data/gpcr_mass_v1
  split: ./data/gpcr_mass_v1/split_by_name.pt
